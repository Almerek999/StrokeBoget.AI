<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrokeBoget.AI</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff4d4d">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StrokeBoget.AI">

    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --danger: #ef4444;
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Glassmorphism Container */
        .container {
            width: 90%;
            max-width: 420px;
            margin-top: 40px;
            padding: 30px;
            box-sizing: border-box;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 { 
            text-align: center; 
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        input {
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid var(--glass-border); 
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.2); 
            color: var(--text-main); 
            font-size: 15px; 
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        input::placeholder { color: #475569; }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; 
            border: none; 
            padding: 16px;
            width: 100%; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }
        button:disabled { 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed; 
            border: 1px solid var(--glass-border);
            transform: none;
        }
        
        #scanner-screen { display: none; text-align: center; width: 100%; }
        
        #video-container {
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto;
            border-radius: 20px; 
            overflow: hidden; 
            border: 2px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }
        video { width: 100%; display: block; transform: scaleX(-1); }
        
        .status-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            padding: 6px 12px;
            border-radius: 12px; 
            font-size: 12px;
            font-weight: 700; 
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .status-normal { 
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-danger { 
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: pulse-danger 1.5s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        #instruction-text {
            font-size: 20px; 
            font-weight: 600; 
            color: var(--text-main);
            margin: 25px 0; 
            min-height: 60px;
            line-height: 1.4;
        }
        
        #sos-screen {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #991b1b, #450a0a);
            color: white; 
            z-index: 9999;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center; 
            padding: 30px; 
            box-sizing: border-box;
        }
        #sos-screen h1 { 
            color: white; 
            font-size: 36px; 
            margin-bottom: 20px; 
            background: none;
            -webkit-text-fill-color: white;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #sos-screen p { 
            font-size: 18px; 
            margin-bottom: 12px; 
            color: #fca5a5;
            font-weight: 500;
        }
        #sos-screen .sos-sent {
            margin-top: 40px; 
            font-weight: bold; 
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН РЕГИСТРАЦИИ -->
    <div id="registration-screen" class="container">
        <h1>StrokeBoget.AI</h1>
        <p class="subtitle">Введите данные для экстренной связи</p>
        
        <div class="input-group">
            <label>Ваше Имя (Пациент):</label>
            <input type="text" id="p_name" placeholder="Например: Иван">
        </div>
        <div class="input-group">
            <label>Имя Родственника:</label>
            <input type="text" id="r_name" placeholder="Например: Мария">
        </div>
        <div class="input-group">
            <label>Email Родственника (Сюда придет SOS):</label>
            <input type="email" id="r_email" placeholder="example@gmail.com">
        </div>
        <div class="input-group">
            <label>Домашний адрес (если GPS недоступен):</label>
            <input type="text" id="p_address" placeholder="Например: г. Астана, ул. Абая 10, кв 5">
        </div>
        <div class="input-group">
            <label>Telegram Chat ID (Опционально):<br><span style="font-size:12px; color:#888;">Узнать свой ID можно в боте <a href="https://t.me/userinfobot" target="_blank" style="color: #4CAF50;">@userinfobot (нажмите здесь)</a></span></label>
            <input type="text" id="r_tg" placeholder="Например: 123456789">
        </div>
        
        <button onclick="startApp()">Включить Сканер</button>
    </div>

    <!-- ЭКРАН СКАНЕРА -->
    <div id="scanner-screen" class="container">
        <h2 style="margin-top:0;">Мониторинг</h2>
        <div id="gps-status" style="margin-bottom: 10px; font-size: 14px; color: #ffaa00;">📍 Поиск GPS...</div>
        
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="face-status" class="status-badge status-normal">Лицо: ПОИСК...</div>
        </div>

        <div id="instruction-text"></div>
        
        <button id="voice-btn" onclick="startVoiceTest()">Проверить Речь</button>
    </div>

    <!-- ЭКРАН SOS -->
    <div id="sos-screen">
        <h1>!!! ВЫЯВЛЕН ИНСУЛЬТ !!!</h1>
        <p>1. Сохраняйте спокойствие и сядьте</p>
        <p>2. Обеспечьте приток воздуха</p>
        <p>3. <b>НЕ ПЕЙТЕ ВОДУ И ТАБЛЕТКИ</b></p>
        <p class="sos-sent">📡 Сигнал родственникам отправлен!</p>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

<script>
    let stream = null;
    let faceCheckInterval = null;
    let isFaceAsymmetric = false;
    let userLat = null;
    let userLon = null;
    
    // Получение элементов
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const faceStatus = document.getElementById('face-status');
    const instructionText = document.getElementById('instruction-text');
    const voiceBtn = document.getElementById('voice-btn');
    const gpsStatus = document.getElementById('gps-status');

    async function startApp() {
        const r_email = document.getElementById('r_email').value;
        if(!r_email) {
            alert("Пожалуйста, введите Email родственника!");
            return;
        }

        document.getElementById('registration-screen').style.display = 'none';
        document.getElementById('scanner-screen').style.display = 'block';
        
        // Запрашиваем GPS координаты у телефона
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    gpsStatus.innerText = "📍 GPS: Подключен";
                    gpsStatus.style.color = "#4CAF50";
                },
                (error) => {
                    gpsStatus.innerText = "📍 GPS: Заблокирован или недоступен (" + error.message + ")";
                    gpsStatus.style.color = "#ff4d4d";
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
            );
        } else {
            gpsStatus.innerText = "📍 GPS: Не поддерживается устройством";
            gpsStatus.style.color = "#ff4d4d";
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            video.srcObject = stream;
            
            // Начинаем проверять лицо (рекурсивный вызов, чтобы не "заддосить" сервер)
            sendFaceFrame();
        } catch (err) {
            alert("Ошибка доступа к камере или микрофону! Убедитесь, что вы открыли сайт по HTTPS.");
            console.error(err);
        }
    }

    async function sendFaceFrame() {
        if (!video.videoWidth) {
            faceCheckInterval = setTimeout(sendFaceFrame, 1500);
            return;
        }
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const base64Image = canvas.toDataURL('image/jpeg', 0.8);

        try {
            const response = await fetch('/analyze_face', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });
            const result = await response.json();
            
            if (result.success && result.asymmetry !== undefined) {
                isFaceAsymmetric = result.asymmetry;
                if (isFaceAsymmetric) {
                    faceStatus.textContent = "Лицо: АСИММЕТРИЯ!";
                    faceStatus.className = "status-badge status-danger";
                } else {
                    faceStatus.textContent = "Лицо: НОРМА";
                    faceStatus.className = "status-badge status-normal";
                }
            }
        } catch (e) {
            console.error("Ошибка анализа лица:", e);
        }
        
        // Планируем следующий кадр только ПОСЛЕ того, как пришел ответ от сервера
        faceCheckInterval = setTimeout(sendFaceFrame, 1500);
    }

    function speak(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Сброс залипших фраз (баг iOS/Android)
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.onend = callback;
            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    async function startVoiceTest() {
        voiceBtn.disabled = true;
        
        // Разблокировка синтезатора речи для асинхронных вызовов (особенность Safari/Chrome)
        if ('speechSynthesis' in window) {
            const unlock = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(unlock);
        }
        
        // 1. Показываем текст и говорим инструкцию
        instructionText.innerText = "ЗА ОКНОМ СЕГОДНЯ СВЕТИТ ЯРКОЕ СОЛНЦЕ";
        speak("Пожалуйста, повторите фразу на экране.", () => {
            // 2. После озвучки начинаем запись аудио
            recordAudio();
        });
    }

    function recordAudio() {
        voiceBtn.innerText = "🎤 Идет запись (5 сек)...";
        instructionText.style.color = "#ff4d4d"; // Красный цвет для привлечения внимания

        let mediaRecorder;
        let audioChunks = [];

        try {
            // Берем только аудио трек из общего потока
            const audioStream = new MediaStream(stream.getAudioTracks());
            mediaRecorder = new MediaRecorder(audioStream);
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                voiceBtn.innerText = "⏳ Анализ нейросетью...";
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                // Отправляем аудио на сервер
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.webm');
                
                try {
                    const response = await fetch('/analyze_voice', { method: 'POST', body: formData });
                    const result = await response.json();
                    
                    if (result.success) {
                        handleTestResult(result.fail);
                    } else {
                        alert("Ошибка анализа голоса: " + result.error);
                        resetVoiceBtn();
                    }
                } catch (e) {
                    console.error("Ошибка сети:", e);
                    resetVoiceBtn();
                }
            };

            mediaRecorder.start();
            
            // Останавливаем через 5 секунд
            setTimeout(() => {
                mediaRecorder.stop();
            }, 5000);

        } catch (e) {
            alert("Ошибка записи аудио!");
            resetVoiceBtn();
        }
    }

    function resetVoiceBtn() {
        voiceBtn.disabled = false;
        voiceBtn.innerText = "Проверить Речь";
        instructionText.style.color = "#ffd700";
    }

    function handleTestResult(isSpeechFail) {
        // По протоколу FAST, наличие ХОТЯ БЫ ОДНОГО признака - повод для вызова скорой
        if (isFaceAsymmetric || isSpeechFail) {
            triggerSOS();
        } else {
            alert("Все в порядке! Признаков инсульта не обнаружено.");
            resetVoiceBtn();
            instructionText.innerText = "";
        }
    }

    function triggerSOS() {
        clearTimeout(faceCheckInterval);
        document.getElementById('sos-screen').style.display = 'flex';
        
        // Отправляем запрос на сервер для рассылки писем/Telegram с координатами GPS
        fetch('/sos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                patient_name: document.getElementById('p_name').value,
                relative_name: document.getElementById('r_name').value,
                relative_email: document.getElementById('r_email').value,
                tg_chat_id: document.getElementById('r_tg').value,
                fallback_address: document.getElementById('p_address').value,
                lat: userLat,
                lon: userLon
            })
        });

        // Голосовая поддержка пациента
        const calmText = "Внимание. Выявлены признаки инсульта. Пожалуйста, сохраняйте спокойствие. Сядьте в удобное положение. Обеспечьте доступ свежего воздуха. Ни в коем случае не пейте воду и не принимайте таблетки. Экстренное сообщение с вашей гео-локацией уже отправлено вашим родственникам. Помощь скоро прибудет.";
        speak(calmText, null);
        
        // Мигание красным фоном
        setInterval(() => {
            const sosScreen = document.getElementById('sos-screen');
            sosScreen.style.backgroundColor = sosScreen.style.backgroundColor === 'rgb(255, 0, 0)' ? '#cc0000' : '#ff0000';
        }, 500);
    }
    
    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('PWA Service Worker зарегистрирован!', reg))
                .catch(err => console.error('Ошибка регистрации PWA:', err));
        });
    }
</script>
</body>
</html>
